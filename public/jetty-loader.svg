<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    .flow-front { animation: jetty-flow 1.6s linear infinite; }
    .flow-back  { animation: jetty-flow-rev 2.6s linear infinite; }
    @keyframes jetty-flow     { from { transform: translateX(0); } to { transform: translateX(-48px); } }
    @keyframes jetty-flow-rev { from { transform: translateX(-48px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .flow-front, .flow-back { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="jetty-lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17908D"/>
      <stop offset="1" stop-color="#0A4F4F"/>
    </linearGradient>
    <clipPath id="jetty-lc"><rect width="96" height="96" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#jetty-lc)">
    <rect width="96" height="96" fill="url(#jetty-lg)"/>
    <path d="M24 26 L70 26" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M52 26 L52 54 Q52 72 38 72 Q26 72 26 60" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <!-- back wave: slower, opposite direction, faint -->
    <g class="flow-back">
      <path d="M0 68 q12 -7 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 V96 H0 Z" fill="#FFFFFF" fill-opacity="0.12"/>
    </g>
    <!-- front wave: water body + gold crest, flows left continuously -->
    <g class="flow-front">
      <path d="M0 58 q12 -8 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 V96 H0 Z" fill="#0A4F4F" fill-opacity="0.6"/>
      <path d="M0 58 q12 -8 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#E8B84A" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
